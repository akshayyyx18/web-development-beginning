<!--create  button which show how many times it is pressed-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myButton {
            font-size: 24px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .js-odd{
            background-color: lightblue;
        }
        .js-even{
            background-color: lightgreen;
        }

        </style>
</head>
<body>
    <button id="myButton" onclick="countClicks()">0</button>
    
    <script>
        let clickCount = localStorage.getItem("clickCount") ? parseInt(localStorage.getItem("clickCount")) : 0;
        let button = document.getElementById("myButton");

        function countClicks() {
            clickCount++;
            localStorage.setItem("clickCount", clickCount);
            if(clickCount % 2 === 0) {
                button.classList.remove("js-odd");
                button.classList.add("js-even");
                // button.className = "js-even";
            } else {
                button.classList.remove("js-even");
                button.classList.add("js-odd");
                // button.className = "js-odd";
            }
            button.innerText = clickCount;
            // button.className = clickCount % 2 === 0 ? "js-even" : "js-odd";
             
        }
    </script>
</body>
</html>
