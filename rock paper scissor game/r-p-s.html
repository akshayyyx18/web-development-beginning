<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="r-p-s.css">
</head>
<body>
        <div class="top"> 
            <h1 class="heading">Rock Paper Scissor</h1>
        </div>
    <div class="choices">
        <div class="choice" id="Rock">
            <img src="images/rock.png" alt="rock" >
        </div>
         <div class="choice" id="Paper">
            <img src="images/paper.png" alt="paper">
        </div>
         <div class="choice" id="Scissor">
            <img src="images/scissors.png" alt="scissor">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p class="user-score">0</p>
            <p><b>You</b></p>
        </div>
         <div class="score">
            <p class="comp-score">0</p>
            <p><b>Computer</b></p>
        </div>
    </div>
    <div class="message-box">
        <div class="message">Play your move</div>
    </div>
    
</body>
<script src="r-p-s.js"></script>
</html>
